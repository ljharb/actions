name: 'fleet: workflow drift report'
description: 'Compare the workflow files of every repository a GitHub App is installed on against templates, keep the full report in a secret gist, and keep a single issue up to date with a summary of the discrepancies'
author: ljharb
inputs:
  app-id:
    description: 'the GitHub App’s ID or client ID'
    required: true
  private-key:
    description: 'the GitHub App’s private key'
    required: true
  accounts:
    description: 'space- or comma-separated accounts (users or orgs) whose App installations may be processed; any other installation is ignored (default: the owner of the repository running this)'
    required: false
    default: ''
  source-accounts:
    description: 'space- or comma-separated accounts (users or orgs) whose repositories are checked when they are the source of a fork the App is installed on, and `committer` has committed to them; forks themselves are never checked'
    required: false
    default: ''
  committer:
    description: 'the login whose commits (as committer) to a fork’s source mean it’s maintained here, and so checked'
    required: false
    default: ${{ github.repository_owner }}
  gist-token:
    description: 'token that can read and write the gists of the user it belongs to (a fine-grained token with the “Gists” account permission set to “Read and write”, or a classic token with the `gist` scope); the full report is kept in one secret gist of theirs (in as many files, each under 1 MB, as it takes), found by its description and updated in place on every run; dry runs keep theirs in another. Required: the run fails without it.'
    required: false
    default: ''
  issue-repository:
    description: '`owner/name` of the repository to keep the report issue in; the App must be installed on it, with the “Issues: Read and write” permission, since its bot writes the issue (and adopts one opened by `github-actions[bot]`)'
    required: false
    default: ${{ github.repository }}
  dry-run:
    description: 'check, summarize, and write the full report to the dry runs’ own gist, but create, edit, or close no issue'
    required: false
    default: 'false'
runs:
  using: node24
  main: ./index.mjs
