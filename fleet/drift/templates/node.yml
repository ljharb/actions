name: 'Tests: node.js {{label}}'

on: [pull_request, push]

permissions:
  contents: read

jobs:
  tests:
    uses: ljharb/actions/.github/workflows/node.yml@main
    cache-mode: read
    with:
      range: '{{range}}'
      type: {{type}}
      command: {{command}}

  node:
    name: 'node {{label}}'
    needs: [tests]
    runs-on: ubuntu-latest
    cache-mode: none
    steps:
      - run: true
