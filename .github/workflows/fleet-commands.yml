name: 'fleet: workflow drift commands'

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

cache-mode: none

jobs:
  commands:
    # a bot's comment never runs a command: the App's own replies would otherwise each start a run, since, unlike GITHUB_TOKEN's, an App's comments trigger workflows
    if: vars.FLEET_APP_ID != '' && github.event.comment.user.type != 'Bot' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-24.04

    # on the job, not the workflow, so that only commands wait their turn: every other comment's run is skipped before it joins the group
    concurrency:
      group: fleet-commands
      cancel-in-progress: false

    # the fleet App's bot reacts to the command, and replies with its outcome, with a token of its own
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443

      - uses: ljharb/actions/fleet/commands@main
        with:
          app-id: ${{ vars.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          accounts: ${{ vars.FLEET_ACCOUNTS }}
