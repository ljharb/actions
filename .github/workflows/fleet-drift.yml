name: 'fleet: workflow drift report'

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'check, summarize, and write the full report to the dry runs’ own gist, but create, edit, or close no issue'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

cache-mode: none

concurrency:
  group: fleet-drift
  cancel-in-progress: false

jobs:
  drift:
    if: vars.FLEET_APP_ID != ''
    runs-on: ubuntu-24.04

    # the report issue is written by the fleet App's bot, with a token of its own
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443

      - uses: ljharb/actions/fleet/drift@main
        with:
          app-id: ${{ vars.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          accounts: ${{ vars.FLEET_ACCOUNTS }}
          source-accounts: ${{ vars.FLEET_SOURCE_ACCOUNTS }}
          gist-token: ${{ secrets.FLEET_GIST_TOKEN }}
          dry-run: ${{ inputs.dry-run == true }}
